[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdgl_LSFD_lib"
version = "0.1.0b1"
description = "TDGL solver on unstructured meshes using LSFD (Least Squares Finite Differences)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dmitrii Zakharov", email = "dmitrii.zakharov@metalab.ifmo.ru"}
]
keywords = ["TDGL", "superconductivity", "spin-orbit coupling", "LSFD", "finite differences", "unstructured mesh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "meshpy>=2022.1",
    "shapely>=2.0",
    "scikit-learn>=1.2",
    "tqdm>=4.65",
    "numba>=0.57",
]

[tool.setuptools.packages.find]
include = ["tdgl_LSFD_lib*"]
